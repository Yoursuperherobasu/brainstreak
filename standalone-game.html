<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BrainRush — Standalone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F4ECE0;        /* warm sand */
    --card: #FBF5EA;      /* cream paper */
    --ink: #3D2914;       /* espresso */
    --ink-2: #6B523A;     /* coffee */
    --ink-3: #9C8770;     /* tan */
    --primary: #E85D40;   /* coral */
    --primary-dark: #C44A30;
    --accent: #3B7A8D;    /* teal */
    --gold: #D4A017;      /* honey */
    --plum: #7E5DB0;
    --success: #5C9E5E;
    --danger: #C84441;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 28px rgba(0,0,0,0.10);
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .display { font-family: 'Bagel Fat One', cursive; }
  .heading { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.5px; }

  .phone {
    width: min(420px, 100vw);
    height: 100vh;
    max-height: 900px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ──────────────────────────────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    background: var(--card);
    box-shadow: var(--shadow-sm);
  }
  .topbar .left { display: flex; gap: 16px; align-items: center; }
  .pill {
    background: var(--bg);
    border: 1px solid #E0D2BC;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
  }
  .lives { color: var(--danger); }
  .score { color: var(--primary); }
  .level { color: var(--accent); }

  /* ── Question card ────────────────────────────────────────────────── */
  .qwrap {
    padding: 20px 16px 8px;
  }
  .qcat {
    display: inline-block;
    background: var(--bg);
    border: 1px solid #E0D2BC;
    color: var(--ink-2);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .qtext {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-weight: 800;
    font-size: 28px;
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: -0.5px;
  }

  /* ── Timer ring ───────────────────────────────────────────────────── */
  .timerrow {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .timerring {
    width: 90px; height: 90px; position: relative;
  }
  .timerring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timerring .num {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: 'Bagel Fat One', cursive;
    font-size: 32px; color: var(--ink);
  }

  /* ── Bubble field ─────────────────────────────────────────────────── */
  .field {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding: 16px;
    align-content: center;
  }
  .bubble {
    aspect-ratio: 1;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: white;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-weight: 700;
    font-size: 18px;
    box-shadow: var(--shadow-md);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.4s ease;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    will-change: transform;
  }
  .bubble:active { transform: scale(0.94); }
  .bubble:hover { box-shadow: var(--shadow-lg); }
  .bubble .letter {
    font-family: 'Bagel Fat One', cursive;
    font-size: 22px;
    opacity: 0.85;
  }
  .bubble.correct {
    transform: scale(1.18);
    box-shadow: 0 0 0 6px rgba(92,158,94,0.4);
  }
  .bubble.wrong { animation: shake 0.3s ease; }
  .bubble.fade { opacity: 0; transform: scale(0.8); pointer-events: none; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  /* gentle continuous bob, staggered phase per nth-child */
  .bubble.idle { animation: bob 3s ease-in-out infinite; }
  .bubble.idle:nth-child(2) { animation-delay: 0.4s; }
  .bubble.idle:nth-child(3) { animation-delay: 0.8s; }
  .bubble.idle:nth-child(4) { animation-delay: 1.2s; }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* ── Result overlay ───────────────────────────────────────────────── */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    font-family: 'Bagel Fat One', cursive;
    font-size: 64px;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.4s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -120%);
  }

  /* ── Start / End screens ──────────────────────────────────────────── */
  .screen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    z-index: 20;
  }
  .screen.hidden { display: none; }
  .screen .emoji { font-size: 96px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .screen h1 {
    font-family: 'Bagel Fat One', cursive;
    font-size: 56px;
    color: var(--primary);
    letter-spacing: -1px;
    margin-bottom: 12px;
  }
  .screen p {
    color: var(--ink-2);
    font-size: 17px;
    line-height: 1.5;
    max-width: 320px;
    margin-bottom: 28px;
  }
  .stats {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: var(--shadow-md);
    display: flex;
    gap: 24px;
    margin-bottom: 24px;
  }
  .stats .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .stats .stat .v {
    font-family: 'Bagel Fat One', cursive;
    font-size: 30px;
    color: var(--ink);
  }
  .stats .stat .l { font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .cta {
    background: linear-gradient(135deg, var(--primary), #F4836B);
    color: white;
    border: none;
    padding: 18px 36px;
    border-radius: 22px;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-weight: 800;
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    transition: transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cta:active { transform: scale(0.96); }

  /* ── Bottom: progress + life dots ─────────────────────────────────── */
  .progress {
    height: 4px;
    background: rgba(0,0,0,0.05);
    overflow: hidden;
  }
  .progress > div {
    height: 100%;
    background: var(--primary);
    transition: width 0.3s ease;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<div class="phone">

  <!-- START SCREEN -->
  <div class="screen" id="screen-start">
    <div class="emoji">🧠</div>
    <h1>BrainRush</h1>
    <p>5 questions. 15 seconds each. Math, English, GK — pop the right bubble before time runs out.</p>
    <button class="cta" id="btn-start">Let's go 🚀</button>
  </div>

  <!-- GAME -->
  <div class="topbar">
    <div class="left">
      <div class="pill score">⭐ <span id="score">0</span></div>
      <div class="pill level">L<span id="level">1</span></div>
    </div>
    <div class="pill lives">❤️ <span id="lives">3</span></div>
  </div>

  <div class="qwrap">
    <span class="qcat" id="qcat">Math · easy</span>
    <div class="qtext" id="qtext">Loading…</div>
  </div>

  <div class="timerrow">
    <div class="timerring">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#E0D2BC" stroke-width="6" />
        <circle id="timer-arc" cx="50" cy="50" r="42" fill="none" stroke="#E85D40" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="0" />
      </svg>
      <div class="num" id="timer-num">15</div>
    </div>
  </div>

  <div class="field" id="field">
    <!-- bubbles injected -->
  </div>

  <div class="progress"><div id="progress-bar" style="width:0%"></div></div>

  <div class="toast" id="toast">+100</div>

  <!-- END SCREEN -->
  <div class="screen hidden" id="screen-end">
    <div class="emoji" id="end-emoji">🌟</div>
    <h1 id="end-title">Brilliant!</h1>
    <div class="stats">
      <div class="stat"><div class="v" id="end-score">0</div><div class="l">SCORE</div></div>
      <div class="stat"><div class="v" id="end-correct">0/5</div><div class="l">CORRECT</div></div>
      <div class="stat"><div class="v" id="end-acc">0%</div><div class="l">ACCURACY</div></div>
    </div>
    <button class="cta" id="btn-restart">Play again 🎮</button>
  </div>

</div>

<script>
// ── Question generators ───────────────────────────────────────────────
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function genMath(level){
  const range = level >= 4 ? 50 : level >= 2 ? 20 : 12;
  const ops = level >= 4 ? ['+','-','×','÷'] : level >= 2 ? ['+','-','×'] : ['+','-'];
  const op = pick(ops);
  let a = Math.floor(Math.random()*range)+1;
  let b = Math.floor(Math.random()*range)+1;
  let correct;
  if (op === '+') correct = a+b;
  else if (op === '-') correct = a-b;
  else if (op === '×') correct = a*b;
  else { b = Math.floor(Math.random()*11)+2; const product = b*(Math.floor(Math.random()*11)+1); a = product; correct = product/b; }
  const distractors = new Set();
  while (distractors.size < 3) {
    const off = (Math.floor(Math.random()*6)+1) * (Math.random()<0.5 ? -1 : 1);
    if (off !== 0) distractors.add(correct + off);
  }
  return {
    category: 'Math',
    difficulty: level >= 4 ? 'hard' : level >= 2 ? 'medium' : 'easy',
    question: `${a} ${op} ${b} = ?`,
    correct: String(correct),
    answers: shuffle([correct, ...distractors]).map(String),
  };
}

const ENGLISH = [
  { q: 'A word that means "happy"', c: 'Joyful', d: ['Lonely','Tired','Angry'], lvl: 'easy' },
  { q: 'The opposite of "tall"', c: 'Short', d: ['Wide','Heavy','Quick'], lvl: 'easy' },
  { q: 'A word that means "fast"', c: 'Quick', d: ['Slow','Late','Soft'], lvl: 'easy' },
  { q: 'Means "to make something better"', c: 'Improve', d: ['Reduce','Confuse','Defer'], lvl: 'medium' },
  { q: 'Means "very large"', c: 'Enormous', d: ['Modest','Average','Petite'], lvl: 'medium' },
  { q: 'A person who travels into space', c: 'Astronaut', d: ['Geologist','Conductor','Linguist'], lvl: 'medium' },
  { q: 'Means "to make something less severe"', c: 'Mitigate', d: ['Magnify','Manifest','Mortgage'], lvl: 'hard' },
  { q: 'Means "lasting a very short time"', c: 'Ephemeral', d: ['Eternal','Empirical','Eccentric'], lvl: 'hard' },
];
function genEnglish(level){
  const want = level >= 4 ? 'hard' : level >= 2 ? 'medium' : 'easy';
  const pool = ENGLISH.filter(x => x.lvl === want);
  const item = pick(pool.length ? pool : ENGLISH);
  return {
    category: 'English',
    difficulty: item.lvl,
    question: item.q,
    correct: item.c,
    answers: shuffle([item.c, ...item.d]),
  };
}

const GK = [
  { q: 'Capital of France', c: 'Paris', d: ['London','Berlin','Madrid'], lvl: 'easy' },
  { q: 'Largest planet', c: 'Jupiter', d: ['Saturn','Mars','Earth'], lvl: 'easy' },
  { q: 'How many continents?', c: '7', d: ['5','6','8'], lvl: 'easy' },
  { q: 'Currency of Japan', c: 'Yen', d: ['Won','Yuan','Rupee'], lvl: 'medium' },
  { q: 'Tallest mountain', c: 'Everest', d: ['K2','Kangchenjunga','Lhotse'], lvl: 'medium' },
  { q: 'Author of Romeo and Juliet', c: 'Shakespeare', d: ['Dickens','Austen','Tolstoy'], lvl: 'medium' },
  { q: 'Year of moon landing', c: '1969', d: ['1965','1972','1959'], lvl: 'hard' },
  { q: 'Element with symbol Au', c: 'Gold', d: ['Silver','Aluminium','Argon'], lvl: 'hard' },
];
function genGK(level){
  const want = level >= 4 ? 'hard' : level >= 2 ? 'medium' : 'easy';
  const pool = GK.filter(x => x.lvl === want);
  const item = pick(pool.length ? pool : GK);
  return {
    category: 'GK',
    difficulty: item.lvl,
    question: item.q,
    correct: item.c,
    answers: shuffle([item.c, ...item.d]),
  };
}

function makeRound(level){
  const gens = [genMath, genEnglish, genGK];
  return Array.from({length: 5}, (_, i) => gens[i % 3](level));
}

// ── Game state ────────────────────────────────────────────────────────
const COLORS = ['#E85D40', '#3B7A8D', '#D4A017', '#7E5DB0'];
const ROUND_TIME = 15;

const $score = document.getElementById('score');
const $level = document.getElementById('level');
const $lives = document.getElementById('lives');
const $qcat = document.getElementById('qcat');
const $qtext = document.getElementById('qtext');
const $field = document.getElementById('field');
const $timerNum = document.getElementById('timer-num');
const $timerArc = document.getElementById('timer-arc');
const $progressBar = document.getElementById('progress-bar');
const $toast = document.getElementById('toast');
const $screenStart = document.getElementById('screen-start');
const $screenEnd = document.getElementById('screen-end');
const $endTitle = document.getElementById('end-title');
const $endEmoji = document.getElementById('end-emoji');
const $endScore = document.getElementById('end-score');
const $endCorrect = document.getElementById('end-correct');
const $endAcc = document.getElementById('end-acc');
const $btnStart = document.getElementById('btn-start');
const $btnRestart = document.getElementById('btn-restart');

let state = {
  level: 1,
  score: 0,
  lives: 3,
  questions: [],
  qIdx: 0,
  correctCount: 0,
  timer: null,
  remaining: ROUND_TIME,
  busy: false,
};

function loadProfile(){
  try {
    const raw = localStorage.getItem('brainrush.profile');
    if (raw) state.level = JSON.parse(raw).level || 1;
  } catch {}
}
function saveProfile(){
  localStorage.setItem('brainrush.profile', JSON.stringify({ level: state.level, lastScore: state.score }));
}

function showToast(text, color){
  $toast.textContent = text;
  $toast.style.color = color;
  $toast.classList.add('show');
  setTimeout(() => $toast.classList.remove('show'), 700);
}

function updateTimer(){
  $timerNum.textContent = state.remaining;
  const arc = 263.89;
  const ratio = state.remaining / ROUND_TIME;
  $timerArc.setAttribute('stroke-dashoffset', arc * (1 - ratio));
  $timerArc.setAttribute('stroke', state.remaining <= 5 ? '#C84441' : state.remaining <= 10 ? '#D4A017' : '#5C9E5E');
}

function renderQuestion(){
  const q = state.questions[state.qIdx];
  $qcat.textContent = `${q.category} · ${q.difficulty}`;
  $qtext.textContent = q.question;
  $field.innerHTML = '';
  q.answers.forEach((ans, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'bubble idle';
    b.style.background = `linear-gradient(135deg, ${COLORS[i]}, ${COLORS[i]}DD)`;
    b.innerHTML = `<span class="letter">${'ABCD'[i]}</span><span>${ans}</span>`;
    b.addEventListener('click', () => onPick(i));
    $field.appendChild(b);
  });
  $progressBar.style.width = `${((state.qIdx) / state.questions.length) * 100}%`;
  state.remaining = ROUND_TIME;
  updateTimer();
  if (state.timer) clearInterval(state.timer);
  state.busy = false;
  state.timer = setInterval(() => {
    state.remaining--;
    updateTimer();
    if (state.remaining <= 0) {
      clearInterval(state.timer);
      onTimeout();
    }
  }, 1000);
}

function onPick(i){
  if (state.busy) return;
  state.busy = true;
  clearInterval(state.timer);
  const q = state.questions[state.qIdx];
  const picked = q.answers[i];
  const correct = picked === q.correct;
  const bubbles = $field.querySelectorAll('.bubble');
  bubbles.forEach((b, idx) => {
    b.classList.remove('idle');
    if (q.answers[idx] === q.correct) {
      b.classList.add('correct');
    } else if (idx === i && !correct) {
      b.classList.add('wrong');
    } else {
      b.classList.add('fade');
    }
  });
  if (correct) {
    const speedBonus = Math.floor(state.remaining * 5);
    const points = 100 + speedBonus;
    state.score += points;
    state.correctCount++;
    $score.textContent = state.score;
    showToast(`+${points}`, '#5C9E5E');
  } else {
    state.lives--;
    $lives.textContent = state.lives;
    showToast('−1 ❤️', '#C84441');
  }
  setTimeout(() => {
    if (state.lives <= 0) return endGame();
    state.qIdx++;
    if (state.qIdx >= state.questions.length) return endGame();
    renderQuestion();
  }, 1100);
}

function onTimeout(){
  state.busy = true;
  state.lives--;
  $lives.textContent = state.lives;
  showToast('⏱️', '#C84441');
  const bubbles = $field.querySelectorAll('.bubble');
  const q = state.questions[state.qIdx];
  bubbles.forEach((b, idx) => {
    b.classList.remove('idle');
    if (q.answers[idx] === q.correct) b.classList.add('correct');
    else b.classList.add('fade');
  });
  setTimeout(() => {
    if (state.lives <= 0) return endGame();
    state.qIdx++;
    if (state.qIdx >= state.questions.length) return endGame();
    renderQuestion();
  }, 1100);
}

function startRound(){
  loadProfile();
  state.questions = makeRound(state.level);
  state.qIdx = 0;
  state.score = 0;
  state.correctCount = 0;
  state.lives = 3;
  $score.textContent = '0';
  $level.textContent = state.level;
  $lives.textContent = '3';
  $screenStart.classList.add('hidden');
  $screenEnd.classList.add('hidden');
  renderQuestion();
}

function endGame(){
  if (state.timer) clearInterval(state.timer);
  const total = state.questions.length;
  const accuracy = Math.round((state.correctCount / total) * 100);
  $endScore.textContent = state.score;
  $endCorrect.textContent = `${state.correctCount}/${total}`;
  $endAcc.textContent = `${accuracy}%`;
  if (accuracy >= 80) { $endEmoji.textContent = '🌟'; $endTitle.textContent = 'Brilliant!'; state.level++; }
  else if (accuracy >= 60) { $endEmoji.textContent = '🎉'; $endTitle.textContent = 'Great!'; }
  else if (accuracy >= 40) { $endEmoji.textContent = '👍'; $endTitle.textContent = 'Not bad'; }
  else { $endEmoji.textContent = '💪'; $endTitle.textContent = 'Keep trying'; }
  saveProfile();
  $screenEnd.classList.remove('hidden');
}

$btnStart.addEventListener('click', startRound);
$btnRestart.addEventListener('click', startRound);

// Show start screen on load
loadProfile();
$level.textContent = state.level;
</script>
</body>
</html>
